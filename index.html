
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Video Gallery</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 30px #00000012;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-top: 0;
    }

    p {
      text-align: center;
      color: #64748b;
      line-height: 1.5;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    input { border: 1px solid #cbd5e1; }

    button {
      background: #1769e0;
      color: white;
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #backBtn {
      background: #475569;
      margin-top: 16px;
    }

    #message {
      text-align: center;
      margin-top: 16px;
      overflow-wrap: anywhere;
    }

    #videoArea {
      display: none;
      margin-top: 22px;
    }

    video {
      display: block;
      width: 100%;
      max-height: 70vh;
      background: #000;
      border-radius: 10px;
    }

    #videoTitle {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .small { font-size: 13px; }
  </style>
</head>

<body>
  <main class="container">
    <h1>🔒 Private Video Gallery</h1>
    <p id="pageDescription">अपना वीडियो एक्सेस कोड डालें।</p>

    <form id="accessForm">
      <input
        id="accessCode"
        type="password"
        placeholder="अपना एक्सेस कोड डालें"
        autocomplete="off"
        required
      >
      <button id="submitBtn" type="submit">
        वीडियो खोलें
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <section id="videoArea">
      <div id="videoTitle"></div>
      <p id="videoDescription"></p>

      <video id="videoPlayer" controls playsinline></video>

      <p class="small">
        सुरक्षा के लिए वीडियो लिंक सीमित समय तक ही काम करेगा।
      </p>

      <button id="backBtn" type="button">
        ⬅️ वापस जाएँ
      </button>
    </section>
  </main>

  <script>
    const API_URL =
      "https://wiwljnfcpcbjvvcewpye.supabase.co/functions/v1/video-gallery";

    const form = document.getElementById("accessForm");
    const codeInput = document.getElementById("accessCode");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");
    const videoArea = document.getElementById("videoArea");
    const videoPlayer = document.getElementById("videoPlayer");
    const backBtn = document.getElementById("backBtn");

    let directToken = null;
    let playbackSession = null;
    let completionSent = false;

    function showVideo(result) {
      document.getElementById("videoTitle").textContent =
        result.title || "आपकी वीडियो";

      document.getElementById("videoDescription").textContent =
        result.description || "";

      videoPlayer.src = result.videoUrl;
      videoArea.style.display = "block";
      form.style.display = "none";

      videoPlayer.load();

      videoPlayer.play().catch(() => {
        message.textContent =
          "वीडियो तैयार है। चलाने के लिए Play दबाएँ।";
      });
    }

    function returnToCodePage() {
      videoPlayer.pause();
      videoPlayer.removeAttribute("src");
      videoPlayer.load();

      directToken = null;
      playbackSession = null;
      completionSent = false;

      videoArea.style.display = "none";
      form.style.display = "block";
      codeInput.value = "";
      message.textContent = "";
      codeInput.focus();
    }

    backBtn.addEventListener("click", returnToCodePage);

    // DIRECT LINK: URL में token होने पर वीडियो अपने आप खोलें।
    async function openDirectLink(token) {
      form.style.display = "none";
      backBtn.style.display = "none";
      message.textContent = "आपका वीडियो खोला जा रहा है...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "open",
            token: token
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success || !result.videoUrl) {
          throw new Error(
            result.error || "वीडियो लिंक नहीं खुल पाया।"
          );
        }

        directToken = result.token;
        playbackSession = result.playbackSession;
        completionSent = false;

        message.textContent = "वीडियो तैयार है।";
        showVideo(result);

      } catch (error) {
        message.textContent =
          error.message === "Failed to fetch"
            ? "कनेक्शन नहीं हो पाया। इंटरनेट जाँचें।"
            : error.message;
      }
    }

    // वीडियो पूरा होने पर Admin को जानकारी भेजें।
    videoPlayer.addEventListener("ended", async () => {
      if (!directToken || !playbackSession || completionSent) {
        return;
      }

      completionSent = true;
      message.textContent = "वीडियो पूरा हो गया।";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "complete",
            token: directToken,
            playbackSession: playbackSession
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          completionSent = false;
          message.textContent =
            "वीडियो पूरा हुआ, लेकिन स्थिति अपडेट नहीं हो सकी।";
          return;
        }

        message.textContent = "वीडियो पूरा देखा गया। धन्यवाद!";
      } catch (error) {
        completionSent = false;
        message.textContent =
          "वीडियो पूरा हुआ, लेकिन सर्वर से संपर्क नहीं हो पाया।";
      }
    });

    // पुराना ACCESS CODE सिस्टम चालू रहेगा।
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const code = codeInput.value.trim();
      if (!code) return;

      submitBtn.disabled = true;
      message.textContent = "कोड जाँचा जा रहा है...";
      videoArea.style.display = "none";
      form.style.display = "block";

      videoPlayer.pause();
      videoPlayer.removeAttribute("src");
      videoPlayer.load();

      directToken = null;
      playbackSession = null;
      completionSent = false;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ code })
        });

        const result = await response.json();

        if (!response.ok || !result.success || !result.videoUrl) {
          throw new Error(
            result.error || "वीडियो नहीं खुल पाया।"
          );
        }

        message.textContent = "कोड सही है। वीडियो तैयार है।";
        showVideo(result);
        backBtn.style.display = "block";
        codeInput.value = "";

      } catch (error) {
        message.textContent =
          error.message === "Failed to fetch"
            ? "कनेक्शन नहीं हो पाया। इंटरनेट या सर्वर जाँचें।"
            : error.message;
      } finally {
        submitBtn.disabled = false;
      }
    });

    // पेज खुलते ही जाँचें कि Direct Link है या पुराना Code पेज।
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (token) {
      document.getElementById("pageDescription").textContent =
        "आपके लिए वीडियो तैयार किया जा रहा है।";

      openDirectLink(token);
    } else {
      form.style.display = "block";
      backBtn.style.display = "block";
    }
  </script>
</body>
</html>
